name: 清理 Actions 运行记录
on:
  workflow_dispatch:
    inputs:
      clean_type:
        description: '0=全部 1=失败 2=取消 3=失败+取消'
        required: true
        default: '1'
        type: choice
        options:
          - '0'
          - '1'
          - '2'
          - '3'
      runner_filter:
        description: 'Runner 范围：Repo / 其他所有'
        required: true
        type: choice
        options:
          - 'Repo'
          - '其他所有'

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 清理符合条件的运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          retain_days: 0
          keep_minimum_runs: 0
          delete_run_by_conclusion_pattern: ${{ inputs.clean_type == '0' && '' || inputs.clean_type == '1' && 'failure' || inputs.clean_type == '2' && 'cancelled' || inputs.clean_type == '3' && 'failure,cancelled' }}
          dry_run: false
